<!doctype html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KUBOMASA DRAWING ENGINE V0.4</title>
<style>
:root{font-family:Arial,"Noto Sans JP",sans-serif;color:#e8edf2;background:#07090b}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}main{max-width:1400px;margin:auto;padding:28px}header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #293039;padding-bottom:22px}small{letter-spacing:.12em;color:#21c8e8;font-weight:800}h1{margin:6px 0;font-size:30px}h1 b{color:#21c8e8}p{color:#89939e}.badge{border:1px solid #20505a;padding:8px 12px;color:#3edaf5}.steps{display:grid!important;grid-template-columns:repeat(6,minmax(120px,1fr));border:1px solid #252b32;margin:18px 0;background:#111419;overflow-x:auto;min-height:72px}.steps button{min-height:70px;border:0;border-right:1px solid #252b32;background:none;color:#68727d;padding:10px;cursor:pointer}.steps button.on{color:white;background:#10262b;box-shadow:inset 0 -3px #21c8e8}.steps b{color:#21c8e8;margin-right:7px}.layout{display:grid;grid-template-columns:2fr .65fr;gap:18px}.panel,aside{border:1px solid #252b32;background:#0d1014;padding:20px}.drop{height:190px;border:2px dashed #3b444e;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;background:#11151a;cursor:pointer}.drop input{display:none}.notice{border:1px solid #644f1d;background:#1b170d;color:#f1c760;padding:11px;margin:13px 0}.cards{display:grid;gap:8px}.card{display:grid;grid-template-columns:110px 1fr 40px;gap:10px;align-items:center;border:1px solid #272e36;background:#11151a;padding:8px}.preview{height:75px;background:#080a0d;display:grid;place-items:center;overflow:hidden}.preview img{width:100%;height:100%;object-fit:contain}.meta b,.meta span{display:block}.meta span{font-size:12px;color:#89939e}.primary{border:0;background:#20c5e4;color:#001014;font-weight:900;padding:12px 18px;margin-top:15px;cursor:pointer}.del{background:none;border:0;color:#89939e;font-size:20px}.rule{padding:12px 0;border-bottom:1px solid #252b32;font-size:13px}.placeholder{height:260px;border:1px dashed #3b444e;display:grid;place-items:center;color:#65707b;margin-top:18px}.calc{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.calc input,.card select{width:100%;background:#080b0e;color:white;border:1px solid #343d46;padding:9px}.answer{font-size:22px;font-weight:bold;margin-top:14px;color:#21c8e8}@media(max-width:800px){main{padding:12px}h1{font-size:22px}.steps{grid-template-columns:repeat(3,1fr)}.layout{grid-template-columns:1fr}aside{display:none}.calc{grid-template-columns:1fr}}
</style></head><body><main>
<header><div><small>KUBOMASA / DRAWING ENGINE</small><h1>AI建築図面復元 <b>V0.7</b></h1><p>図面を建築データへ。読めない寸法は勝手に確定しない。</p></div><span class="badge">AI CONNECTED</span></header>
<button class="primary" onclick="step=0;render()">＋ 図面を追加する</button><div class="steps" id="steps"></div><div class="layout"><section class="panel" id="app"></section><aside><h3>復元ルール</h3><div class="rule">✓ 読めない寸法は「要確認」</div><div class="rule">✓ 平面・立面を相互照合</div><div class="rule">✓ 外周は角でなく「面」で番号</div><div class="rule">✓ 屋根は勾配込み実面積</div><div class="rule">✓ AI Vision / Cloudflare Worker 接続</div></aside></div>
</main><script>
const labels=["図面取込","AI図面認識","寸法復元","平面・立面照合","屋根実面積","CAD出力"];let step=0,files=[];
function nav(){steps.innerHTML=labels.map((x,i)=>`<button class="${i===step?'on':''}" onclick="step=${i};render()"><b>0${i+1}</b>${x}</button>`).join('')}
function render(){nav(); if(step===0)upload();else if(step===1)recognize();else if(step===4)roof();else app.innerHTML=`<small>STEP 0${step+1}</small><h2>${labels[step]}</h2><p>${step===2?'図面記載値 / 計算確定値 / AI推定値 / 要確認を分離して復元します。':step===3?'外周の「面」に①②③…を自動付与し、平面と東西南北立面を照合します。':'まずDXFを正式出力し、Jw_cadで編集可能にします。'}</p><div class="placeholder">この工程は次の開発段階で実装</div>`}
function upload(){app.innerHTML=`<small>STEP 01</small><h2>図面をまとめて取り込む</h2><label class="drop">＋<b>写真・PDFを追加</b><span>JPG / PNG / PDF・複数選択</span><input id="pick" type="file" accept="image/*,application/pdf" multiple></label><div class="notice">図面を登録後、STEP 02で認識状態を確認します。AI未接続時は推測値を表示しません。</div><div class="cards" id="cards"></div>`;pick.onchange=e=>{[...e.target.files].forEach(f=>files.push({f,url:f.type.startsWith('image/')?URL.createObjectURL(f):'',kind:'未認識',rot:0}));drawCards()};drawCards()}
function drawCards(){if(!window.cards)return;cards.innerHTML=files.map((x,i)=>`<div class="card"><div class="preview">${x.url?`<img src="${x.url}">`:'PDF'}</div><div class="meta"><b>${x.f.name}</b><span>${x.kind} ・ 要確認</span></div><button class="del" onclick="files.splice(${i},1);drawCards()">×</button></div>`).join('')+(files.length?'<button class="primary" onclick="step=1;render()">AI図面認識へ →</button>':'')}
const API='https://noisy-hat-f085.masato-kubota-47.workers.dev';
function recognize(){app.innerHTML=`<small>STEP 02</small><h2>AI図面認識</h2><div class="notice">Cloudflare経由でOpenAI Visionへ接続します。読めない寸法は「要確認」。PDF解析はまだ未実装です。</div><div style="display:flex;gap:10px;align-items:center;margin:12px 0;flex-wrap:wrap"><span class="badge">AI CONNECTED</span><button class="primary" onclick="analyzeAll()">画像をAI解析</button><button class="primary" onclick="integrateBuilding()">建物を統合解析 →</button></div><div id="integrated"></div><div class="cards" id="results">${files.map((x,i)=>cardResult(x,i)).join('')}</div>`}
function cardResult(x,i){let a=x.analysis;return `<div class="card"><div class="preview">${x.url?`<img src="${x.url}">`:'PDF'}</div><div class="meta"><b>${x.f.name}</b><span>${x.status||'未解析'}</span>${a?`<span>種類: ${a.drawing_type||'要確認'} / 方向: ${a.orientation||'要確認'} / 階: ${a.floor||'要確認'}</span><span>寸法: ${(a.dimensions||[]).map(d=>d.value+(d.unit||'')).join(' / ')||'要確認'}</span><span>確認: ${(a.needs_confirmation||[]).join(' / ')||'なし'}</span>`:''}</div></div>`}
function toDataURL(f){return new Promise((ok,no)=>{let r=new FileReader();r.onload=()=>ok(r.result);r.onerror=no;r.readAsDataURL(f)})}
async function analyzeAll(){for(let i=0;i<files.length;i++){let x=files[i];if(!x.f.type.startsWith('image/')){x.status='PDF解析は未実装・要確認';continue}x.status='AI解析中…';results.innerHTML=files.map((v,j)=>cardResult(v,j)).join('');try{let image=await toDataURL(x.f);let r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({image})});let d=await r.json();if(!r.ok)throw new Error(d.error+(d.details?' / '+JSON.stringify(d.details):''));let raw=d.analysis;let txt=raw&&raw.output_text;if(!txt&&raw&&raw.output)txt=raw.output.flatMap(o=>o.content||[]).find(z=>z.type==='output_text')?.text;try{x.analysis=typeof txt==='string'?JSON.parse(txt):raw}catch{x.analysis={drawing_type:'要確認',needs_confirmation:['AI応答JSONの解析に失敗'],notes:[txt||'']}}x.status='AI解析完了'}catch(e){x.status='エラー: '+e.message}results.innerHTML=files.map((v,j)=>cardResult(v,j)).join('')}}
async function integrateBuilding(){
  if(!files.length){alert('先に図面を追加してください');return}
  const done=files.filter(x=>x.analysis);
  if(!done.length){alert('先に「画像をAI解析」を実行してください');return}
  integrated.innerHTML='<div class="notice">建物統合解析中… 平面・立面・寸法の関係を照合しています。</div>';
  const summary=done.map((x,i)=>({id:i+1,file:x.f.name,drawing_type:x.analysis.drawing_type||'',orientation:x.analysis.orientation||'',floor:x.analysis.floor||'',dimensions:x.analysis.dimensions||[],elevations:x.analysis.elevations||[],notes:x.analysis.notes||[],needs_confirmation:x.analysis.needs_confirmation||[]}));
  try{
    const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({mode:'integrate',drawings:summary})});
    const d=await r.json(); if(!r.ok)throw new Error(d.error+(d.details?' / '+JSON.stringify(d.details):''));
    let raw=d.analysis,txt=raw&&raw.output_text;if(!txt&&raw&&raw.output)txt=raw.output.flatMap(o=>o.content||[]).find(z=>z.type==='output_text')?.text;
    let a;try{a=typeof txt==='string'?JSON.parse(txt):raw}catch{a={status:'要確認',needs_confirmation:['統合結果JSONの解析に失敗']}}
    window.buildingAnalysis=a;
    integrated.innerHTML='<div class="notice"><b>建物統合解析 完了</b><br>基準平面: '+(a.reference_plan||'要確認')+'<br>外周面: '+((a.exterior_faces||[]).map(x=>x.face_id+' '+(x.length||'要確認')+' '+(x.elevation_direction||'')).join(' / ')||'要確認')+'<br>立面: '+((a.elevation_mapping||[]).map(x=>(x.direction||'要確認')+'→'+((x.face_ids||[]).join(','))).join(' / ')||'要確認')+'<br>矛盾: '+((a.conflicts||[]).join(' / ')||'なし')+'<br>確認事項: '+((a.needs_confirmation||[]).join(' / ')||'なし')+'</div>';
  }catch(e){integrated.innerHTML='<div class="notice">統合解析エラー: '+e.message+'</div>'}
}
function roof(){app.innerHTML=`<small>STEP 05</small><h2>屋根実面積</h2><p>水平距離と勾配から傾斜実長を算出します。</p><div class="calc"><label>軒→棟 水平距離(mm)<input id="run" type="number" oninput="calc()"></label><label>屋根長さ(mm)<input id="len" type="number" oninput="calc()"></label><label>勾配(寸)<input id="pitch" type="number" oninput="calc()"></label></div><div class="answer" id="ans">傾斜実長 — / 面積 —</div>`}
function calc(){let r=+run.value,l=+len.value,p=+pitch.value;if(r&&l){let s=Math.sqrt(r*r+(r*p/10)**2);ans.textContent=`傾斜実長 ${s.toFixed(0)} mm / 面積 ${(s*l/1e6).toFixed(2)} ㎡`}}
render();
</script></body></html>
